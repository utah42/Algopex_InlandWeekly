<style>
:root {
  --bg: #e8eef4;
  --surface: #f7fafc;
  --ink: #102033;
  --muted: #5b6c7d;
  --line: #c5d2de;
  --brand: #0a3d5c;
  --accent: #c45c26;
  --up: #1f7a4d;
  --down: #b42318;
  --cutter-a: #0a3d5c;
  --cutter-b: #c45c26;
  --chg: #6b7280;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(180deg, #d5e3ef, var(--bg));
  min-height: 100vh; line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 1rem 2.5rem; }
.sticky-head {
  position: sticky; top: 0; z-index: 40;
  margin: 0 0 1rem;
  padding: .15rem .05rem .75rem;
  background: linear-gradient(180deg, rgba(232,238,244,.98), rgba(247,250,252,.96));
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 6px 18px rgba(16, 32, 51, .06);
  max-height: min(78vh, 720px);
  overflow-y: auto;
}
.sticky-head .head-row,
.sticky-head h2,
.sticky-head .kpis {
  padding-left: 1.05rem;
  padding-right: 1.05rem;
}
.sticky-head .head-row { padding-top: .5rem; }
.sticky-head .kpis { padding-bottom: .15rem; }
.sticky-head h2 {
  color: var(--brand);
  font-size: 1.02rem;
  font-weight: 700;
  margin: 0 0 .35rem;
}
.head-row {
  display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  flex-wrap: nowrap; padding: .65rem 0 .45rem;
  border-bottom: 1px solid var(--line); margin-bottom: .5rem;
}
.head-left {
  display: flex; align-items: baseline; gap: .65rem; min-width: 0; flex: 1;
  white-space: nowrap; overflow: hidden;
}
h1 {
  color: var(--brand); font-size: clamp(1.05rem, 2.2vw, 1.4rem);
  margin: 0; line-height: 1.2; flex-shrink: 0;
}
.lede {
  color: var(--muted); font-size: .82rem; margin: 0;
  overflow: hidden; text-overflow: ellipsis;
}
.head-actions {
  display: flex; align-items: center; gap: .45rem; flex-shrink: 0;
}
.head-legend {
  display: inline-flex; align-items: center; gap: .35rem;
}
.head-legend .delta { margin: 0; cursor: default; }
.head-actions a {
  color: var(--brand); font-size: .78rem; text-decoration: none;
  padding: .26rem .55rem; border: 1px solid var(--line); border-radius: 3px; background: #fff;
}
.head-actions button {
  border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 3px;
  padding: .26rem .6rem; font: inherit; font-size: .74rem; cursor: pointer; font-weight: 600;
}
.head-actions button:hover { background: #0c4d72; }
.head-actions a:hover { background: #e8eef4; }
.pills {
  display: flex; flex-wrap: nowrap; gap: .35rem; margin: 0;
  flex-shrink: 0; align-items: center;
}
.pill {
  display: inline-flex; align-items: center; gap: .35rem;
  border: 1px solid var(--line); border-radius: 999px; padding: .22rem .62rem;
  background: #fff; font-size: .74rem; cursor: pointer; color: var(--muted);
}
.pill.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.pill input { display: none; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: .55rem; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: .65rem .8rem;
}
.kpi .label,
.mini .k {
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0;
  text-transform: none;
  background: none;
  padding: 0;
  border-radius: 0;
}
.kpi .value {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand);
  font-variant-numeric: tabular-nums;
  margin: .1rem 0;
}
.kpi .meta { font-size: .74rem; color: var(--muted); }
.delta {
  display: inline-flex; align-items: center; gap: .2rem;
  padding: .18rem .45rem;
  border-radius: 999px; font-size: .72rem; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 1.2;
  background: #e8eef4; color: var(--muted);
}
.delta.up {
  color: #0f5c38; background: #d8f3e3; box-shadow: inset 0 0 0 1px #9fd4b5;
}
.delta.down {
  color: #8f1d14; background: #fde2df; box-shadow: inset 0 0 0 1px #efb0a8;
}
.delta.flat {
  color: #445566; background: #e8eef4; box-shadow: inset 0 0 0 1px #c5d2de;
}
.kpi .delta, .mini .delta { margin-top: .28rem; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 1rem 1.05rem; margin-bottom: 1rem;
}
.panel h2 { color: var(--brand); font-size: 1.02rem; margin-bottom: .35rem; }
.panel .hint { font-size: .8rem; color: var(--muted); margin-bottom: .6rem; }
.mini-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-bottom: .75rem; }
.mini {
  border: 1px solid var(--line); border-radius: 3px; padding: .55rem .6rem; background: #fff;
}
.mini.chg {
  border-color: var(--chg);
  background: var(--chg);
}
.mini.chg .k,
.mini.chg .v { color: #ffffff; }
.mini.chg .d { color: rgba(255, 255, 255, 0.88); }
.mini.chg .delta.up {
  color: #0f5c38; background: #d8f3e3; box-shadow: inset 0 0 0 1px #9fd4b5;
}
.mini.chg .delta.down {
  color: #8f1d14; background: #fde2df; box-shadow: inset 0 0 0 1px #efb0a8;
}
.mini.chg .delta.flat {
  color: #445566; background: #e8eef4; box-shadow: inset 0 0 0 1px #c5d2de;
}
.mini .v { font-size: 1.05rem; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.mini .d { font-size: .72rem; }
.mini .d .delta { margin-top: .2rem; }
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 460px; }
.improve-section { margin-top: 0; }
.improve-cards {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem;
}
.improve-card {
  background: #fff; border: 1px solid var(--line); border-radius: 4px;
  border-top: 3px solid var(--accent); padding: .85rem .9rem;
}
.improve-card h3 {
  color: var(--brand); font-size: .88rem; margin-bottom: .55rem;
}
.improve-card ul {
  margin: 0; padding-left: 1.15rem; color: var(--ink);
  font-size: .82rem; line-height: 1.55;
}
.improve-card li { margin-bottom: .4rem; }
.improve-card li:last-child { margin-bottom: 0; }
.improve-card .placeholder {
  color: var(--muted); font-size: .82rem; font-style: italic; min-height: 3.2rem; margin: 0;
}
.footer {
  margin-top: 1.25rem;
  padding-top: .75rem;
  border-top: 1px dashed var(--line);
  font-size: .7rem;
  color: var(--muted);
  line-height: 1.45;
}
@media (max-width: 900px) {
  .kpis, .mini-kpis { grid-template-columns: 1fr 1fr; }
  .chart-box.tall { height: 320px; }
  .improve-cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .kpis, .mini-kpis, .improve-cards { grid-template-columns: 1fr; }

body.is-printing .chart-box.tall {

  }
  .improve-section { break-inside: avoid; }
  .improve-cards {

  .improve-card h3 { font-size: .68rem; margin-bottom: .15rem; }
  .improve-card ul { font-size: .58rem; line-height: 1.3; }
  .footer {

    padding: .3rem .1rem 0; border-top: 1px solid var(--line);

  }

</style>

const state = {
  selected: {},
  charts: {}
};

const CUTTER_COLORS = ["#0a3d5c", "#c45c26", "#1a8a7a", "#8e44ad"];
const STACK_COLORS = {
  net: "#1a8a7a",
  pos: "#2980b9",
  off: "#e67e22",
  oth: "#c0392b",
  chg: "#6b7280" // 与 .mini.chg / --chg 一致
};

function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); state.charts[key] = null; }
}

function selectedCutters() {
  return (DATA.cutters || []).map(c => c.id).filter(id => state.selected[id]);
}

function filterRows(rows) {
  const sel = new Set(selectedCutters());
  return rows.filter(r => sel.has(r.cutter));
}

function shortCutterLabel(c) {
  const name = (c.name || c.id || "").trim();
  // Prefer trailing "N号裁床" style if present
  const m = name.match(/(\d+)\s*号裁床/);
  if (m) return m[0];
  if (name.length > 18) return c.id;
  return name || c.id;
}

function enrichCutterDay(row, hAvail, inputPer) {
  const muFromGold = row.mu_pct != null && !Number.isNaN(row.mu_pct);
  const mu = muFromGold
    ? row.mu_pct
    : (hAvail > 0 ? 100 * row.net_h / hAvail : null);
  const avail = (mu != null && mu > 0) ? row.net_h / (mu / 100) : hAvail;
  const input_h = inputPer;
  const idle_h = Math.max(0, avail - row.net_h - input_h - row.pos_h - row.off_h - row.oth_h);
  return {
    day: row.day,
    cutter: row.cutter,
    cutter_name: row.cutter_name,
    n: 1,
    avail_h: avail,
    input_h,
    idle_h,
    net_h: row.net_h,
    pos_h: row.pos_h,
    off_h: row.off_h,
    oth_h: row.oth_h,
    chg_h: row.chg_h || 0,
    material_m: row.material_m,
    perimeter_m: row.perimeter_m,
    speed: row.speed,
    mu,
    mu_from_gold: muFromGold
  };
}

function aggCutterPeriod(rows, hAvail, inputPer) {
  if (!rows.length) {
    return {
      days: [], material_m: 0, net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0,
      input_h: 0, idle_h: 0, avail_h: 0, mu: null, speed: null, active_days: 0
    };
  }
  const days = rows.map(r => enrichCutterDay(r, hAvail, inputPer));
  const sum = (k) => days.reduce((a, d) => a + d[k], 0);
  const speeds = days.map(d => d.speed).filter(v => v != null);
  const avail = sum("avail_h");
  const net = sum("net_h");
  let muWeighted = null;
  {
    let netFromMu = 0, availFromMu = 0;
    days.forEach(d => {
      if (d.mu_from_gold && d.mu != null && d.mu > 0 && d.net_h > 0) {
        netFromMu += d.net_h;
        availFromMu += d.net_h / (d.mu / 100);
      }
    });
    if (availFromMu > 0) muWeighted = 100 * netFromMu / availFromMu;
  }
  return {
    days,
    material_m: sum("material_m"),
    net_h: net,
    pos_h: sum("pos_h"),
    off_h: sum("off_h"),
    oth_h: sum("oth_h"),
    chg_h: sum("chg_h"),
    input_h: sum("input_h"),
    idle_h: sum("idle_h"),
    avail_h: avail,
    mu: muWeighted != null ? muWeighted : (avail > 0 ? 100 * net / avail : null),
    speed: speeds.length ? speeds.reduce((a, b) => a + b, 0) / speeds.length : null,
    active_days: days.length
  };
}

function plantAvgFromCutterAggs(aggs) {
  const list = Object.values(aggs).filter(Boolean);
  if (!list.length) {
    return {
      material_m: 0, mu: null, speed: null, active_days: 0,
      net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0, input_h: 0, idle_h: 0, avail_h: 0
    };
  }
  const avg = (key) => {
    const vals = list.map(a => a[key]).filter(v => v != null && !Number.isNaN(v));
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  };
  const sum = (key) => list.reduce((a, x) => a + (x[key] || 0), 0);
  return {
    material_m: avg("material_m"),
    mu: avg("mu"),
    speed: avg("speed"),
    active_days: avg("active_days"),
    net_h: sum("net_h"),
    pos_h: sum("pos_h"),
    off_h: sum("off_h"),
    oth_h: sum("oth_h"),
    chg_h: sum("chg_h"),
    input_h: sum("input_h"),
    idle_h: sum("idle_h"),
    avail_h: sum("avail_h")
  };
}

function dailyAvgFromPeriod(period) {
  const n = period.active_days || 0;
  if (!n) return null;
  return {
    material_m: period.material_m / n,
    net_h: period.net_h / n,
    pos_h: period.pos_h / n,
    off_h: period.off_h / n,
    oth_h: period.oth_h / n,
    chg_h: period.chg_h / n,
    input_h: period.input_h / n,
    idle_h: period.idle_h / n,
    mu: period.mu,
    speed: period.speed,
    active_days: n
  };
}

function fmt(v, digits) {
  if (v == null || Number.isNaN(v)) return "—";
  return Number(v).toFixed(digits);
}

const WEEKDAY_ZH = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function dayAxisLabel(isoDay) {
  const [y, m, d] = isoDay.split("-").map(Number);
  const wd = WEEKDAY_ZH[new Date(y, m - 1, d).getDay()];
  return `${isoDay.slice(5)} ${wd}`;
}

function addDaysIso(isoDay, n) {
  const [y, m, d] = isoDay.split("-").map(Number);
  const dt = new Date(y, m - 1, d + n);
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return `${dt.getFullYear()}-${mm}-${dd}`;
}

function emptyCutterDay(isoDay, cutterId) {
  return {
    day: isoDay, cutter: cutterId, n: 0, avail_h: 0, input_h: 0, idle_h: 0,
    net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0,
    material_m: 0, perimeter_m: 0, speed: null, mu: null, placeholder: true
  };
}

function weekCalendarDays() {
  const start = DATA.week_start;
  const out = [];
  for (let i = 0; i < 7; i++) out.push(addDaysIso(start, i));
  return out;
}

function deltaHtml(cur, base, digits, unit, label = "对比上周", lowerBetter = false) {
  if (cur == null || base == null || base === 0) {
    return `<span class="delta flat">${label} —</span>`;
  }
  const d = cur - base;
  const pct = 100 * d / Math.abs(base);
  const rose = d > 0.0001;
  const fell = d < -0.0001;
  const good = lowerBetter ? fell : rose;
  const bad = lowerBetter ? rose : fell;
  const cls = good ? "up" : (bad ? "down" : "flat");
  const arrow = rose ? "▲" : (fell ? "▼" : "●");
  const sign = d > 0 ? "+" : "";
  const u = unit ? ` ${unit}` : "";
  if (unit === "pp") {
    return `<span class="delta ${cls}">${arrow} ${label} ${sign}${d.toFixed(digits)}${u}</span>`;
  }
  return `<span class="delta ${cls}">${arrow} ${label} ${sign}${d.toFixed(digits)}${u}（${sign}${pct.toFixed(1)} pp）</span>`;
}

function initSelection() {
  (DATA.cutters || []).forEach(c => { state.selected[c.id] = true; });
}

function renderPills() {
  const el = document.getElementById("cutterPills");
  if (!el) return;
  el.innerHTML = (DATA.cutters || []).map((c, i) => {
    const on = state.selected[c.id] ? "on" : "";
    const color = CUTTER_COLORS[i % CUTTER_COLORS.length];
    return `<label class="pill ${on}" data-id="${c.id}" style="${on ? '' : `border-color:${color};color:${color}`}">
      <input type="checkbox" ${state.selected[c.id] ? "checked" : ""} />
      ${shortCutterLabel(c)}
    </label>`;
  }).join("");
  el.querySelectorAll(".pill").forEach(pill => {
    pill.addEventListener("click", (e) => {
      e.preventDefault();
      const id = pill.getAttribute("data-id");
      const onCount = selectedCutters().length;
      if (state.selected[id] && onCount <= 1) return; // keep at least one
      state.selected[id] = !state.selected[id];
      renderAll();
    });
  });
}

function buildCutterAggs(rows) {
  const hAvail = DATA.config.h_avail;
  const inputPer = DATA.config.input_h_per_cutter_day;
  const by = {};
  selectedCutters().forEach(id => {
    const cr = rows.filter(r => r.cutter === id);
    by[id] = aggCutterPeriod(cr, hAvail, inputPer);
  });
  return by;
}

function renderMainKpis(plant, monthAvg, prev) {
  // 对齐骏泰周报：展示上月基准 + 对比上周 + 对比上月
  // 产量「对比上月」= 上月日均 × 本周有产天，便于与本周合计对齐
  const cards = [
    { label: "稼动率 (%)", unit: "%", cur: plant.mu, month: monthAvg && monthAvg.mu, prev: prev && prev.mu, digits: 1 },
    { label: "裁剪速度 (m/min)", unit: " m/min", cur: plant.speed, month: monthAvg && monthAvg.speed, prev: prev && prev.speed, digits: 2 },
    {
      label: "产量 Cut Material (m)",
      unit: " m",
      cur: plant.material_m,
      month: monthAvg ? monthAvg.material_m * (plant.active_days || 1) : null,
      monthDaily: monthAvg ? monthAvg.material_m : null,
      prev: prev && prev.material_m,
      digits: 1
    }
  ];
  document.getElementById("mainKpis").innerHTML = cards.map((c, idx) => {
    let baseLabel;
    if (idx === 2) {
      baseLabel = `上月日均 ${fmt(c.monthDaily, 1)} m`;
    } else {
      baseLabel = `上月均 ${fmt(c.month, c.digits)}${c.unit}`;
    }
    const unitSuffix = c.unit.trim();
    const deltaUnit = unitSuffix === "%" ? "pp" : unitSuffix;
    return `<div class="kpi">
      <div class="label">${c.label}</div>
      <div class="value">${fmt(c.cur, c.digits)}</div>
      <div class="meta">${baseLabel}</div>
      <div class="meta">${deltaHtml(c.cur, c.prev, c.digits, deltaUnit, "对比上周")}</div>
      <div class="meta">${deltaHtml(c.cur, c.month, c.digits, deltaUnit, "对比上月")}</div>
    </div>`;
  }).join("");
}

function renderTimeKpis(plant, monthAvg, prev) {
  const items = [
    { k: "net_h", label: "净裁剪 (h)", dig: 1, lowerBetter: false },
    { k: "pos_h", label: "定位 (h)", dig: 1, lowerBetter: true },
    { k: "off_h", label: "卸料 (h)", dig: 1, lowerBetter: true },
    { k: "chg_h", label: "换床 (h)", dig: 1, lowerBetter: true, accent: true }
  ];
  document.getElementById("timeKpis").innerHTML = items.map(it => {
    const cur = plant[it.k];
    const m = monthAvg ? monthAvg[it.k] : null;
    const monthEq = m == null ? null : m * (plant.active_days || 1);
    const cls = it.accent ? "mini chg" : "mini";
    return `<div class="${cls}">
      <div class="k">${it.label}</div>
      <div class="v">${fmt(cur, it.dig)}</div>
      <div class="d">两机合计 · 上月日均 ${fmt(m, it.dig)} h</div>
      <div class="d">${deltaHtml(cur, prev ? prev[it.k] : null, it.dig, "h", "对比上周", it.lowerBetter)}</div>
      <div class="d">${deltaHtml(cur, monthEq, it.dig, "h", "对比上月日均×有产天", it.lowerBetter)}</div>
    </div>`;
  }).join("");
}

function pctOfAvail(val, avail) {
  if (avail == null || avail <= 0 || val == null || val <= 0) return null;
  return 100 * val / avail;
}

function cutterHashTag(c, ci) {
  const m = String(shortCutterLabel(c) || "").match(/(\d+)/);
  return m ? `#${m[1]}` : `#${ci + 1}`;
}

function stackPctLabelPlugin(dayMeta) {
  // dayMeta[i] = { avail_h, net_h, pos_h, off_h } for each bar index in order of datasets draw
  return {
    id: "stackPctLabels",
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const keysByDs = {};
      chart.data.datasets.forEach((ds, dsIdx) => {
        if (ds._pctKey) keysByDs[dsIdx] = ds._pctKey;
      });
      Object.keys(keysByDs).forEach(dsIdxStr => {
        const dsIdx = Number(dsIdxStr);
        const key = keysByDs[dsIdx];
        const ds = chart.data.datasets[dsIdx];
        const tag = ds && ds._cutterTag ? ds._cutterTag : "";
        const meta = chart.getDatasetMeta(dsIdx);
        if (meta.hidden) return;
        meta.data.forEach((bar, i) => {
          const day = dayMeta[dsIdx] && dayMeta[dsIdx][i];
          if (!day || day.placeholder) return;
          const pct = pctOfAvail(day[key], day.avail_h);
          if (pct == null || pct < 4) return;
          const top = Math.min(bar.y, bar.base);
          const h = Math.abs(bar.base - bar.y);
          if (h < 11) return;
          const cy = top + h / 2;
          ctx.save();
          ctx.textAlign = "center";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0,0,0,0.45)";
          ctx.shadowBlur = 2;
          if (tag && h >= 28) {
            ctx.textBaseline = "middle";
            ctx.font = "700 13px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
            ctx.fillText(`${pct.toFixed(0)}%`, bar.x, cy - 7);
            ctx.font = "700 12px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
            ctx.fillText(tag, bar.x, cy + 8);
          } else {
            ctx.textBaseline = "middle";
            ctx.font = "700 12px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
            ctx.fillText(`${pct.toFixed(0)}%`, bar.x, cy);
          }
          ctx.restore();
        });
      });
    }
  };
}

function renderTimeStackDual(cutterAggs) {
  destroyChart("stack");
  const cutters = (DATA.cutters || []).filter(c => state.selected[c.id]);
  const calendarDays = weekCalendarDays();
  const labels = calendarDays.map(dayAxisLabel);

  const datasets = [];
  const dayMetaByDs = {};
  const stackKeys = [
    { key: "net_h", label: "净裁剪", color: STACK_COLORS.net, pct: true },
    { key: "pos_h", label: "定位", color: STACK_COLORS.pos, pct: true },
    { key: "off_h", label: "卸料", color: STACK_COLORS.off, pct: true },
    { key: "oth_h", label: "Other", color: STACK_COLORS.oth, pct: false },
    { key: "chg_h", label: "换床", color: STACK_COLORS.chg, pct: false }
  ];

  cutters.forEach((c, ci) => {
    const byDay = {};
    (cutterAggs[c.id]?.days || []).forEach(d => { byDay[d.day] = d; });
    const padded = calendarDays.map(day => byDay[day] || emptyCutterDay(day, c.id));
    const short = shortCutterLabel(c);
    const cutterTag = cutterHashTag(c, ci);
    stackKeys.forEach((sk, ski) => {
      const dsIdx = datasets.length;
      const ds = {
        // 图例只展示颜色含义；机台用柱边框 / #1#2 区分
        label: sk.label,
        data: padded.map(d => d[sk.key] || 0),
        backgroundColor: sk.color,
        stack: `c${ci}`,
        borderWidth: 0,
        categoryPercentage: 0.78,
        barPercentage: 0.98,
        maxBarThickness: 48,
        _cutterTag: cutterTag,
        _stackKey: sk.key,
        _legendShow: ci === 0
      };
      if (sk.pct) ds._pctKey = sk.key;
      datasets.push(ds);
      if (sk.pct) dayMetaByDs[dsIdx] = padded;
    });
  });

  state.charts.stack = new Chart(document.getElementById("chartTimeStack"), {
    type: "bar",
    data: { labels, datasets },
    plugins: [stackPctLabelPlugin(dayMetaByDs)],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            boxWidth: 10,
            font: { size: 9 },
            // 每种颜色只出现一次（不按机台重复）
            generateLabels(chart) {
              const items = [];
              const seen = new Set();
              chart.data.datasets.forEach((ds, i) => {
                if (!ds || !ds._legendShow || !ds._stackKey || seen.has(ds._stackKey)) return;
                seen.add(ds._stackKey);
                items.push({
                  text: ds.label,
                  fillStyle: ds.backgroundColor,
                  strokeStyle: ds.backgroundColor,
                  lineWidth: 0,
                  hidden: !chart.isDatasetVisible(i),
                  datasetIndex: i
                });
              });
              return items;
            }
          },
          onClick(e, legendItem, legend) {
            const chart = legend.chart;
            const clicked = chart.data.datasets[legendItem.datasetIndex];
            if (!clicked || !clicked._stackKey) return;
            const key = clicked._stackKey;
            const hide = chart.isDatasetVisible(legendItem.datasetIndex);
            chart.data.datasets.forEach((ds, i) => {
              if (ds._stackKey === key) chart.setDatasetVisibility(i, !hide);
            });
            chart.update();
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          grid: { display: false },
          ticks: {
            font: { size: 10 },
            maxRotation: 0,
            autoSkip: false
          }
        },
        y: {
          stacked: true,
          title: { display: true, text: "工时 (h)" },
          ticks: { font: { size: 10 } }
        }
      }
    }
  });
}

function renderAll() {
  renderPills();
  const weekRows = filterRows(DATA.week_rows || []);
  const prevRows = filterRows(DATA.prev_rows || []);
  const monthRows = filterRows(DATA.month_rows || []);

  const cutterAggs = buildCutterAggs(weekRows);
  const prevAggs = buildCutterAggs(prevRows);
  const monthAggs = buildCutterAggs(monthRows);

  const plant = plantAvgFromCutterAggs(cutterAggs);
  const prev = Object.keys(prevAggs).length ? plantAvgFromCutterAggs(prevAggs) : null;
  const monthPeriod = Object.keys(monthAggs).length ? plantAvgFromCutterAggs(monthAggs) : null;
  const monthAvg = monthPeriod ? dailyAvgFromPeriod(monthPeriod) : null;

  renderMainKpis(plant, monthAvg, prev);
  renderTimeKpis(plant, monthAvg, prev);
  renderTimeStackDual(cutterAggs);

  const cutterNames = (DATA.cutters || []).map(c => shortCutterLabel(c)).join(" / ");
  const chartNote = DATA.config.mu_source_chart ? `金标准截图：${DATA.config.mu_source_chart}；` : "";
  const muNote = (DATA.config.mu_source === "algopex_machine_use")
    ? `稼动率%=Algopex Machine Use（${DATA.config.mu_gold_file || "machine_use_daily.json"}，日度优先，缺则自然月单机值；周度截图展开到日）；周 MU=100×Σnet÷Σavailable；`
    : `稼动率%=Markers 反推 100×净裁剪/(有产日×${DATA.config.h_avail}h)；待补 machine_use_daily.json；`;
  document.getElementById("footerNote").innerHTML =
    `Inland 双机台 ${cutterNames}。大数字=两机平均；工时卡/堆叠=两机合计/分机双柱。口径：不过滤 Reliable/Completed；速度=日均；产量=Σ Cut Material Length (m)；` +
    muNote + chartNote +
    `Available 由 MU 反推（Net÷MU%）；Input≈${DATA.config.input_h_per_cutter_day}h/机/日。` +
    `对比上周=${DATA.prev_iso_key || "—"}；上月日均基准=${DATA.month_ym || "—"}` +
    (DATA.week_month_ym ? `（本周所属月 ${DATA.week_month_ym}）` : ``) +
    `。数据源：${(DATA.sources || []).join(" · ")}`;
}

initSelection();
renderAll();

function resizeCharts() {
  Object.keys(state.charts).forEach((key) => {
    const chart = state.charts[key];
    if (chart) chart.resize();
  });
}

function pdfTitleTag() {
  const key = String(DATA.iso_key || "");
  // 2026-W41 → 2026W41
  return key.replace("-", "");
}

window.addEventListener("beforeprint", () => {
  if (!document.body.dataset.prevTitle) {
    document.body.dataset.prevTitle = document.title;
  }
  document.title = `Inland生产周报${pdfTitleTag()}`;
  document.body.classList.add("is-printing");
  resizeCharts();
});
window.addEventListener("afterprint", () => {
  document.body.classList.remove("is-printing");
  if (document.body.dataset.prevTitle) {
    document.title = document.body.dataset.prevTitle;
    delete document.body.dataset.prevTitle;
  }
  resizeCharts();
});

document.getElementById("btnExportPdf").addEventListener("click", () => {
  document.body.dataset.prevTitle = document.title;
  document.title = `Inland生产周报${pdfTitleTag()}`;
  document.body.classList.add("is-printing");
  resizeCharts();
  requestAnimationFrame(() => {
    setTimeout(() => { window.print(); }, 120);
  });
});
</script>
